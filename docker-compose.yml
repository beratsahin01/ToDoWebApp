version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo_web_app
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Database=TaskAppDb;User Id=Sa;Password=${DB_PASSWORD:-YourStrongPassword123!};TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis_cache:6379
      - Resend__ApiKey=${RESEND_API_KEY:-}
    depends_on:
      - db
      - redis_cache
    restart: unless-stopped

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: todo_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:-YourStrongPassword123!}
    ports:
      - "1433:1433"
    restart: unless-stopped

  redis_cache:
    image: redis:alpine
    container_name: todo_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
