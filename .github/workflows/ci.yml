name: CI - Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Docker Verification
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: ⚙️ Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: 📦 Restore dependencies
      run: dotnet restore ToDoWebApp.csproj

    - name: 🔨 Build application (Release)
      run: dotnet build ToDoWebApp.csproj --no-restore --configuration Release

    - name: 🐳 Verify Docker Build
      run: docker build -t todowebapp:ci .
